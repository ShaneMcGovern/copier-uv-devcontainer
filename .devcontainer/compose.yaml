---
name: uv-devcontainer-repo

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      - ..:/workspace
      - venv:/workspace/.venv
      - uv-cache:/home/developer/.cache/uv
      - precommit-cache:/home/developer/.cache/pre-commit
    working_dir: /workspace
    init: true
    environment:
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - UV_CACHE_DIR=/home/developer/.cache/uv
      - PRE_COMMIT_HOME=/home/developer/.cache/pre-commit
    healthcheck:
      test: ["CMD", "test", "-x", "/workspace/.venv/bin/python"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  venv:
  uv-cache:
  precommit-cache:
