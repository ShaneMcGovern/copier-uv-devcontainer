---
# The interpreters the python_version question offers. copier.yml pulls this in
# with a YAML `!include` and takes its default from entry [0], so keep the list
# newest-first. Use the latest patch of each minor that upstream still supports.
#
# Every entry must exist as `python:<version>-slim-bookworm` on Docker Hub,
# since the answer becomes both .python-version and the container's FROM tag.

- "3.14.7"
- "3.13.15"
- "3.12.14"
- "3.11.16"
- "3.10.21"
